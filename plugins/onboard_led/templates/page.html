<header class="dashboard-header">
<div>
<p class="eyebrow">Device Feature</p>
<h1>Onboard LED</h1>
<p class="dashboard-subtitle">Switch the Pico 2 W's built-in LED directly from the dashboard.</p>
</div>
</header>
{{? MESSAGE > feature_notice.html}}
<section class="dashboard-section">
<div class="control-status">
<span><strong>LED status</strong><small>The physical onboard indicator is currently {{STATE}}.</small></span>
<form action="/features/onboard-led/set" method="post">
<input type="hidden" name="state" value="{{NEXT_STATE}}">
<button class="state-toggle {{BUTTON_CLASS}}" type="submit" title="{{BUTTON_TOOLTIP}}" aria-label="{{BUTTON_TOOLTIP}}">{{BUTTON_LABEL}}</button>
</form>
</div>
</section>
