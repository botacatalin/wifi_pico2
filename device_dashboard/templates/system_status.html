<section class="dashboard-section system-status">
<div class="section-heading"><span>System status</span></div>
<div class="metric-grid">
<div class="metric-card">
<span class="metric-label">Server uptime</span>
<strong class="metric-value">{{UPTIME}}</strong>
<span class="metric-threshold">Refresh the page to see latest values.</span>
</div>
<div class="metric-card temperature-card {{TEMPERATURE_STATE}}">
<span class="metric-label">Processor temperature</span>
<strong class="metric-value">{{TEMPERATURE}}</strong>
<span class="metric-threshold">Critical at {{TEMPERATURE_LIMIT}} °C or higher</span>
</div>
</div>
</section>
